name: Build EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装打包工具
        run: python -m pip install --upgrade pip pyinstaller

      - name: 下载 adb 与 OCR
        run: python tools/setup.py

      - name: PyInstaller 打包
        run: |
          python -m PyInstaller --noconfirm --windowed --name AlienTimer `
            --icon src/app.ico --add-data "src/app.ico;." --paths src `
            --add-binary "src/adb.exe;." `
            --add-binary "src/AdbWinApi.dll;." `
            --add-binary "src/AdbWinUsbApi.dll;." `
            --hidden-import uuid --hidden-import winreg --hidden-import typing_extensions `
            --distpath dist --workpath build --specpath build src/gui.py

      - name: 放入 OCR 运行库
        run: |
          New-Item -ItemType Directory -Force dist/AlienTimer/_internal/ocr | Out-Null
          Copy-Item -Recurse vendor/ocr/winrt dist/AlienTimer/_internal/ocr/winrt

      - uses: actions/upload-artifact@v4
        with:
          name: AlienTimer-win64
          path: dist/AlienTimer
          retention-days: 14
